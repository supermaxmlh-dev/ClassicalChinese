name: Azure Static Web Apps CI/CD (gray-hill)
run-name: gray-hill deploy ${{ github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and validate data
        run: npm run build
      - name: Prepare static app artifact
        run: node scripts/build-site.js
      - name: Verify static app artifact
        run: |
          test -f dist/index.html
          test -f dist/staticwebapp.config.json
          find dist -maxdepth 2 -type f | sort
      - name: Check Azure deployment token
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_HILL_03261AE00 }}
        run: |
          test -n "$AZURE_STATIC_WEB_APPS_API_TOKEN" || {
            echo "::error::Missing GitHub secret AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_HILL_03261AE00"
            exit 1
          }
          echo "Deployment token length: ${#AZURE_STATIC_WEB_APPS_API_TOKEN}"
          printf '%s' "$AZURE_STATIC_WEB_APPS_API_TOKEN" | sha256sum | cut -c1-12 | sed 's/^/Deployment token fingerprint: /'
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_HILL_03261AE00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "dist" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_HILL_03261AE00 }}
          action: "close"

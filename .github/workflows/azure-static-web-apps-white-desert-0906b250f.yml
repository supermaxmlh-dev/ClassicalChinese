name: Azure Static Web Apps CI/CD (white-desert)
run-name: white-desert deploy ${{ github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and validate data
        run: npm run build
      - name: Prepare static app artifact
        run: node scripts/build-site.js
      - name: Verify static app artifact
        run: |
          test -f dist/index.html
          test -f dist/staticwebapp.config.json
          test -f dist/pages/feedback.html
          find dist -maxdepth 2 -type f | sort
      - name: Check Azure deployment token
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_DESERT_0906B250F }}
        run: |
          test -n "$AZURE_STATIC_WEB_APPS_API_TOKEN" || {
            echo "::error::Missing GitHub secret AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_DESERT_0906B250F"
            exit 1
          }
          echo "Deployment token length: ${#AZURE_STATIC_WEB_APPS_API_TOKEN}"
          printf '%s' "$AZURE_STATIC_WEB_APPS_API_TOKEN" | sha256sum | cut -c1-12 | sed 's/^/Deployment token fingerprint: /'
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_DESERT_0906B250F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: "api"
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_DESERT_0906B250F }}
          action: "close"

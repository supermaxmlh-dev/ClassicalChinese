      <section class="content-card prose">
        <p>观止学堂是一个面向中小学生的经典文言文学习网站。它以 52 周主线精学《古文观止》名篇，另设“拓展阅读”收录课内文言名篇，并提供导读、注释、翻译、练习和词汇积累。</p>
        <p>本站学习功能本地优先：文章内容来自预构建 JSON 文件，学习进度只保存在当前浏览器的 Cookie 中。反馈留言等在线功能只是可降级的叠加层，不影响阅读、判分、进度和字典。</p>

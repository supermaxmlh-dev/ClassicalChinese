      <section class="content-card prose">
        <p>观止学堂是一个面向中小学生的文言文学习网站。它把《古文观止》经典篇章拆成 52 周学习计划，并提供导读、注释、翻译、练习和词汇积累。</p>
        <p>本站为纯静态项目，无需后端服务。文章内容来自预构建 JSON 文件，学习进度只保存在当前浏览器的 LocalStorage 中。建议定期在“学习进度”页面导出备份。</p>
